name: main

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    name: lint
    steps:
      - uses: actions/checkout@v4

      - run: make lint

  tests:
    needs:
      - lint
    runs-on: macos-latest
    timeout-minutes: 10
    name: tests

    steps:
      - uses: actions/checkout@v4

      - run: swift --version

      - run: make test

      - run: make app

  release:
    name: release
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
      - tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - id: release-please
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          package-name: obsidian-quickadd-macos-menubar

  assets:
    name: assets
    needs:
      - release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - run: make app SWIFT_FLAGS="--arch arm64 --arch x86_64"

      - run: ditto -c -k --keepParent .build/QuickAddMenubar.app QuickAddMenubar.zip

      - run: gh release upload "$TAG" QuickAddMenubar.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
